# The Snap Store package of DispCtrl for Linux. snapcraft only looks for
# snap/snapcraft.yaml at a project's root, so that path is a symlink to this
# file: the Store's build from GitHub finds it there, and the rest of the
# packaging stays under build/. pack.sh beside it builds locally from a clean
# copy of the repository, which keeps bin/ and obj/ out.
#
# Strict confinement, without DDC/CI. What that costs, and why classic is not
# on offer, is in docs/design/LINUX-PORT.md ("Snap packaging"); in short:
#   - /dev/i2c-* is out of reach. The `i2c` interface is slotted by a gadget
#     snap on Ubuntu Core and has no slot on a desktop; `custom-device` needs
#     a Store grant and still cannot load i2c-dev. So no ddcutil is staged:
#     one that could only fail would read as a broken install.
#   - The Store grants classic only to compilers, IDEs, shells and the like
#     ("Reviewing classic confinement snaps"); a display utility is not one.
#   - Everything X11 works strictly, because the x11 interface is the whole X
#     protocol: gamma ramps, key grabs, XInput2, overlays, moving other
#     windows through EWMH, Composite, and display arrangement.
#   - The laptop backlight goes through logind's Session.SetBrightness, which
#     login-session-control allows. It is not auto-connected: until the Store
#     grants that, `snap connect dispctrl-linux:login-session-control`.
#
# The engine is started at sign-in through snapd's autostart, not as a user
# daemon: `daemon-scope: user` is still behind experimental.user-daemons in
# snapd 2.77, so a snap that used it would not install by default, and a
# user unit would start before the session's DISPLAY is known.
name: dispctrl-linux
title: DispCtrl
summary: Per-display brightness, night light, presets and snap layouts
description: |
  Windows 11-style display controls, lighting and window management for X11 desktops.

  Displays
  - Warm or dim any display through its gamma ramp, with a night light schedule.
  - Arrange displays and change resolution, refresh rate and orientation.
  - Set a laptop panel's backlight; unison keeps displays matched.
  - Save the whole desk as a preset and bring it back in one click.

  Lighting
  - Colour and effects for keyboards, mice, fans and strips through OpenRGB.
  - A per-key keyboard editor with saved colour sets and a colour-order fix for keyboards that swap red and green.

  Windows and desktop
  - Snap layouts and Snap Assist, pinning windows on top, and moving them between displays.
  - Keep the computer awake, switch dark mode, change the wallpaper.
  - A tray icon with a quick panel, hotkeys, and the dispctrl-linux command.

  A small engine starts at sign-in and keeps your settings applied. The window and the command both talk to it.

  Needs an X11 session. On Wayland the compositor keeps gamma and window placement to itself.

  Not in the snap: an external monitor's own brightness over DDC/CI, because strict confinement cannot reach the I2C buses. The .deb and the tarball from the project's releases can.

  The laptop backlight needs one permission the Store does not connect by itself yet:
  sudo snap connect dispctrl-linux:login-session-control

  Linux guide: https://github.com/HaythmKenway/DispCtrl-linux/blob/master/docs/LINUX.md
  A Linux port of DispCtrl by Jesvi Jonathan: https://github.com/jesvijonathan/DispCtrl
website: https://github.com/HaythmKenway/DispCtrl-linux
source-code: https://github.com/HaythmKenway/DispCtrl-linux
issues: https://github.com/HaythmKenway/DispCtrl-linux/issues
donation:
  - https://paypal.me/0x4kil
  - https://github.com/HaythmKenway/DispCtrl-linux#support-the-project
license: MIT
icon: src/DispCtrl.Linux.Gui/Assets/dispctrl.png
base: core24
confinement: strict
grade: stable
adopt-info: dispctrl-linux

platforms:
  amd64:
  arm64:

environment:
  # Staged libraries are not on the loader's path by default under core24,
  # and the client loads libX11 and friends by soname (DllImport and
  # NativeLibrary.TryLoad), so they must be found here, not on the host.
  LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
  # gsettings: the schemas DispCtrl reads and writes (theme, GNOME's custom
  # shortcuts, its night light and extensions) are staged and compiled
  # below; without the dconf module GIO falls back to a memory backend and
  # a shortcut "set" would vanish silently.
  GSETTINGS_SCHEMA_DIR: $SNAP/usr/share/glib-2.0/schemas
  GIO_MODULE_DIR: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gio/modules
  FONTCONFIG_FILE: $SNAP/etc/fonts/fonts.conf
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

# No dbus slot for the engine's session-bus name: the Store sends a snap that
# declares one to human review (1.0.4 was held on it), which stops automatic
# publishing. Without it the engine's claim is denied and ignored, and the
# /proc scan alone guards against a second install (Installs.cs).

apps:
  dispctrl-linux:
    command: lib/dispctrl-linux
    command-chain: [bin/launch]
    # network-bind is for the engine's command socket, not a network: the
    # default seccomp filter allows bind but not listen or accept, so without
    # it the engine died with EACCES at Listen. It is on the command line too,
    # which runs the engine as "dispctrl-linux engine", and on the window,
    # whose first run starts it (bin/launch). Auto-connected.
    plugs: &plugs
      - x11
      - desktop
      - gsettings
      - hardware-observe
      - login-session-control
      - network-bind
      # Keep awake: GNOME's session inhibitor and org.freedesktop.ScreenSaver.
      - screen-inhibit-control
      # Lighting: OpenRGB's SDK server on 127.0.0.1:6742; without it the
      # connection was refused under confinement. Auto-connected.
      - network
  gui:
    command: lib/dispctrl-linux-gui
    command-chain: [bin/launch]
    desktop: usr/share/applications/dispctrl-linux.desktop
    # The tray icon at sign-in (dispctrl-linux.gui --tray); bin/launch puts
    # the entry in place on first use, as it does the engine's.
    autostart: dispctrl-linux-tray.desktop
    plugs:
      - x11
      - desktop
      - desktop-legacy
      - gsettings
      - hardware-observe
      - login-session-control
      - network-bind
      - network
      - screen-inhibit-control
      # The tray icon: StatusNotifierItem and its dbusmenu on the session bus.
      - unity7
  engine:
    command: lib/dispctrl-linux engine
    command-chain: [bin/launch]
    # snapd runs it at sign-in when ~/snap/dispctrl-linux/current/.config/
    # autostart/ holds this file; bin/launch puts it there on first use.
    autostart: dispctrl-linux-engine.desktop
    plugs: *plugs

parts:
  dispctrl-linux:
    plugin: nil
    source: .
    build-packages:
      - curl
      - ca-certificates
      - libglib2.0-bin
    build-environment:
      # The SDK's own globalization would need ICU in the build; the client
      # is built invariant anyway.
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
      - DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      - DOTNET_NOLOGO: "1"
      - DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    override-pull: |
      craftctl default
      version="${DISPCTRL_VERSION:-$(sed -n 's:.*<DispCtrlVersion>\(.*\)</DispCtrlVersion>.*:\1:p' build/linux/Linux.Build.props)}"
      craftctl set version="$version"
    override-build: |
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64) rid=linux-x64 ;;
        arm64) rid=linux-arm64 ;;
        *) echo "no .NET runtime for $CRAFT_ARCH_BUILD_FOR" >&2; exit 1 ;;
      esac
      version="$(craftctl get version)"

      # Microsoft's SDK at the version global.json pins, as the release
      # workflow uses; the dotnet-sdk-100 snap is a source build that can lag
      # a feature band. Kept in the part's build folder, never staged.
      sdk="$CRAFT_PART_BUILD/.dotnet"
      if [ ! -x "$sdk/dotnet" ]; then
        curl -fsSL --retry 3 https://dot.net/v1/dotnet-install.sh -o "$CRAFT_PART_BUILD/dotnet-install.sh"
        bash "$CRAFT_PART_BUILD/dotnet-install.sh" --jsonfile global.json --install-dir "$sdk" --no-path
      fi
      export DOTNET_ROOT="$sdk" PATH="$sdk:$PATH" NUGET_PACKAGES="$CRAFT_PART_BUILD/.nuget"

      # Both into one folder, sharing one runtime, as package.sh does;
      # ReadyToRun for both: the command line starts on every command, and the
      # window's first click on the tray icon waited for its code to compile.
      lib="$CRAFT_PART_INSTALL/lib"
      dotnet publish src/DispCtrl.Linux/DispCtrl.Linux.csproj -c Release -r "$rid" \
        --self-contained true -p:PublishReadyToRun=true -p:Version="$version" -o "$lib" -v q --nologo
      dotnet publish src/DispCtrl.Linux.Gui/DispCtrl.Linux.Gui.csproj -c Release -r "$rid" \
        --self-contained true -p:PublishReadyToRun=true -p:Version="$version" -o "$lib" -v q --nologo
      # The tracing provider links liblttng-ust, which nothing here uses.
      rm -f "$lib"/*.pdb "$lib/libcoreclrtraceptprovider.so"
      find "$lib" -type f -exec chmod 0644 {} +
      chmod 0755 "$lib/dispctrl-linux" "$lib/dispctrl-linux-gui"
      [ -f "$lib/createdump" ] && chmod 0755 "$lib/createdump"
      "$lib/dispctrl-linux" version | grep -qx "dispctrl-linux $version" \
        || { echo "the published command line does not report $version" >&2; exit 1; }

      # The window's entry, with the icon by path: a snap cannot add to the
      # host's icon theme, so a theme name would show the generic icon.
      apps="$CRAFT_PART_INSTALL/usr/share/applications"
      install -D -m 0644 src/DispCtrl.Linux.Gui/Assets/dispctrl.png "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/dispctrl-linux.png"
      install -D -m 0644 build/packaging/linux/desktop/dispctrl-linux.desktop "$apps/dispctrl-linux.desktop"
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/256x256/apps/dispctrl-linux.png|' "$apps/dispctrl-linux.desktop"
    stage-packages:
      # What the client loads by soname (Distro.Libraries), and gsettings.
      - libx11-6
      - libxrandr2
      - libxi6
      - libxtst6
      - libxext6
      - libxss1
      - libxfixes3
      - libxcomposite1
      - libcairo2
      - libpango-1.0-0
      - libpangocairo-1.0-0
      - libfontconfig1
      - fontconfig-config
      - libice6
      - libsm6
      - libglib2.0-bin
      - dconf-gsettings-backend
      - gsettings-desktop-schemas
      - gnome-settings-daemon-common
      - gnome-shell-common
    prime:
      - -usr/share/doc
      - -usr/share/man
      - -usr/share/lintian
      - -usr/share/bug
      - -usr/share/locale
      - -usr/share/gnome-shell
      - -usr/share/gnome-control-center
      - -usr/share/sounds
      - -usr/share/icons/hicolor/scalable
      - -usr/share/icons/hicolor/symbolic
    override-prime: |
      craftctl default
      glib-compile-schemas usr/share/glib-2.0/schemas

  launcher:
    plugin: dump
    source: build/packaging/linux/snap
    organize:
      launch: bin/launch
      dispctrl-linux-engine.desktop: share/dispctrl-linux/dispctrl-linux-engine.desktop
      dispctrl-linux-tray.desktop: share/dispctrl-linux/dispctrl-linux-tray.desktop
    stage:
      - bin/launch
      - share/dispctrl-linux/dispctrl-linux-engine.desktop
      - share/dispctrl-linux/dispctrl-linux-tray.desktop
